name: Checks

# The gate that makes `master` protectable: every pull request runs the Python test
# suite, ruff, and the frontend build. Nothing here touches the network beyond the
# package indexes - the data pipeline is deliberately not run on pull requests (see
# #6). It makes live calls to GDELT, Wikidata and HuggingFace; the tests run against
# fixed fixtures instead.
#
# The Python project lives in `backend/` since #81, so every step that runs uv needs a
# working directory. The frontend job is four checks in one, and the name says so: it
# lints, runs the unit suite, builds the static export, and then grades that export
# twice - once for whether the page survives with scripts stripped, once against the
# weight budget in ADR 0002. A build that does not compile must not reach `master`,
# because `assemble-site.sh` would then refuse to publish and the site would freeze.
#
# Job names are `area · tool`, and they are load-bearing: `master`'s branch protection
# requires them by exact string, so renaming one here without updating the protection
# leaves every future pull request waiting on a check that will never report.
#
# No type checker on the Python side: explicitly deferred on #6. TypeScript is checked
# by `next build`, which fails on a type error.

on:
  pull_request:
  workflow_dispatch:

# One run per branch; a new push supersedes the previous run.
concurrency:
  group: checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read


jobs:
  test:
    name: Backend · pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      - name: Run tests
        run: uv run pytest -v
        working-directory: backend

  publish:
    name: Scripts · publish.sh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # publish.sh decides where irrecoverable data lands, and it is shell rather than
      # Python, so pytest never sees it. It gets its own suite, run against a
      # throwaway bare repo — nothing here touches the real remote.
      - name: Test the publish script
        run: bash .github/scripts/test-publish.sh

  lint:
    name: Backend · ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      # ruff is pinned in the `dev` dependency group and resolved through
      # uv.lock, so the rule set cannot drift under CI when a new ruff ships.
      - name: Lint
        run: uv run ruff check --output-format=github .
        working-directory: backend

      - name: Check formatting
        run: uv run ruff format --check --diff .
        working-directory: backend

  frontend:
    name: Frontend · build, markup, weight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Unit tests
        run: npm test
        working-directory: frontend

      # Builds at the site root rather than at a base path. What this proves is that
      # the tree compiles and exports; the base path is supplied per deployment by
      # assemble-site.sh and cannot be checked here, because a pull request does not
      # know which previews will exist when it is published.
      - name: Fetch the run the page describes
        run: |
          # The pipeline's output is on its own ref, not in this one. Without it the
          # build has reference tables and no stories, which is a different page and
          # would let a regression through unmeasured.
          git fetch --depth 1 origin data
          git show origin/data:data/stories.json > data/stories.json

      - name: Build the static export
        run: npm run build
        working-directory: frontend

      # The check that makes the component choice hold. It strips <script> blocks
      # first: Next serialises the whole tree into the RSC payload, so a naive grep
      # for the page's text passes even when the page is empty without JavaScript.
      - name: The exported HTML carries the page
        run: npm run check:markup
        working-directory: frontend

      # Two budgets, and they mean different things: the content half is ours, the
      # total is mostly what Next costs. See docs/adr/0002.
      - name: The page is within its weight budget
        run: npm run check:weight
        working-directory: frontend
