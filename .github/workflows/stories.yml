name: Story engine

# The v2 engine: one window of GDELT document embeddings, clustered into themes and
# then stories, reconciled against the previous run by URL overlap, and measured.
#
# It writes to two refs with opposite rules (#10). Current state — what the site reads,
# plus the cache the next run reconciles against — goes to `data`, which is force-pushed
# and keeps no history. The record and the capture go to `history`, append-only, one
# directory per run, because they are the only outputs time cannot rebuild: GDELT drops
# what it does not keep, so an hour not captured is gone.
#
# Every four hours, at seven minutes past rather than half past.
#
# The minute is not decoration and the old comment here was wrong about why it was
# kept. Measured over 57 delivered runs and 13.5 days, GitHub honours about 70% of
# what this cron asks for, every run arrives 13 to 225 minutes late, and the slots do
# not fail evenly:
#
#     00:30   3 runs        12:30  10 runs
#     04:30  12 runs        16:30  12 runs
#     08:30   6 runs        20:30  14 runs
#
# A four-hourly cron on the half hour is a popular thing to ask for, and GitHub's own
# guidance is to avoid high-load times. Moving off it is a cheap experiment and is
# labelled as one: it may do nothing, and only weeks of runs will say.
#
# What is NOT left to the experiment is the data. A gap wider than the window loses
# GDELT permanently, so the window is sized against the worst delivered gap rather
# than against the asked cadence - see WINDOW_SLOTS, which this measurement moved from
# 12 hours to 16 after finding two gaps had already breached it.
# `master` is never written to by either.

on:
  schedule:
    - cron: '7 */4 * * *'
  workflow_dispatch:

concurrency:
  group: story-engine
  cancel-in-progress: false


jobs:
  run:
    name: Engine · fetch, group, publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # to ask Pages for a rebuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen
        working-directory: backend

      # Story identity is a join against the previous run, so a missing state file
      # does not fail the run — it just makes every story look new for one cycle.
      - name: Fetch the previous run's state
        run: |
          mkdir -p out
          if git fetch --quiet --no-tags --depth=1 origin data \
             && git show FETCH_HEAD:data/state.json > out/state.json 2>/dev/null; then
            echo "carried over $(wc -c < out/state.json) bytes of state"
            # The series is accumulated run to run the same way. Missing on a first
            # run, and the engine starts one from this run rather than failing.
            git show FETCH_HEAD:data/series.json > out/series.json 2>/dev/null \
              && echo "carried over $(wc -c < out/series.json) bytes of series" \
              || rm -f out/series.json
          else
            rm -f out/state.json
            echo "no previous state — this run reconciles against nothing"
          fi

      # The day-wide selection (#29 d6, #66) needs the per-run indexes from the
      # append-only ref. Fetched here rather than in the engine, which does not speak
      # git — the same shape as the state fetch above. A missing index is not an error:
      # the engine then selects over this window alone, which is what it did before.
      - name: Fetch the recent indexes
        run: |
          # Two spans, one fetch. The engine features the widest divisions of the last
          # 24 hours and draws each featured story's line over the last seven days, and
          # it separates the two itself (run.py: SPAN_HOURS against SERIES_HOURS). What
          # is fetched here is the wider of the two; handing over a week does not widen
          # the selection.
          #
          # An index is ~280 KB, so eight days is a few MB against the ~15 MB capture
          # this same job already publishes.
          mkdir -p history
          git fetch --quiet --no-tags --depth=100 origin history || {
            echo "no history ref yet - selecting over this window alone"; exit 0; }
          for offset in 8 7 6 5 4 3 2 1 0; do
            day="$(date -u -d "$offset days ago" +%Y/%m/%d)"
            git ls-tree -r --name-only FETCH_HEAD -- "history/$day" 2>/dev/null \
              | grep '/index.json$' || true
          done | sort -u > wanted.txt
          count=0
          while read -r path; do
            [ -n "$path" ] || continue
            stamp="$(echo "$path" | sed -E \
              's#history/([0-9]{4})/([0-9]{2})/([0-9]{2})/([0-9]{4})/index.json#\1\2\3\4#')"
            git show "FETCH_HEAD:$path" > "history/$stamp.json" 2>/dev/null && count=$((count+1))
          done < wanted.txt
          echo "carried $count per-run indexes into the selection"

      # Measured at 47s for 21.7k articles (#10); the ceiling is here for a hung fetch.
      - name: Run the engine
        run: |
          # --project rather than --directory: the engine's paths (data/, out/,
          # history/) are relative to the repository root, and --directory would
          # move the working directory into backend/ along with the project.
          timeout 2400 uv run --project backend python -m tensionr.stories \
            --out out \
            --state out/state.json \
            --series out/series.json \
            --history history \
            --aliases data/actors/aliases.json \
            --polities data/polities/domains.json

      - name: Validate output
        run: |
          for f in stories state record capture index series; do
            jq empty "out/$f.json" && echo "out/$f.json is valid JSON"
          done
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('out/feed.xml')" \
            && echo "out/feed.xml is well-formed"

      # The site reads stories.json; state.json is the next run's starting point. Both
      # are regenerable, so they belong on the ref that keeps no history.
      - name: Publish current state
        id: publish
        run: |
          mkdir -p data
          cp out/stories.json out/state.json out/series.json out/feed.xml data/
          .github/scripts/publish.sh state data \
            data/stories.json data/state.json data/series.json data/feed.xml \
            | tee publish.log
          grep -q 'nothing to push' publish.log \
            && echo "changed=false" >> "$GITHUB_OUTPUT" \
            || echo "changed=true"  >> "$GITHUB_OUTPUT"

      # The prefix comes from the run's own stamp rather than the clock, so the path
      # names the window that was measured, not the moment the push happened.
      - name: Publish the record
        run: |
          stamp="$(jq -r .run out/record.json)"     # 20260803T143000Z
          prefix="history/${stamp:0:4}/${stamp:4:2}/${stamp:6:2}/${stamp:9:4}"
          echo "writing $prefix"
          .github/scripts/publish.sh history history "$prefix" \
            out/record.json out/capture.json out/index.json

      # Pages watches refs this job does not write, so the rebuild has to be asked for
      # or the site keeps serving the last merge's data.
      - name: Rebuild the site
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref master
