name: Tensionr Data Synchronizer

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --frozen

    - name: Run data pipeline
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: timeout 600 uv run tensionr

    - name: Validate output data
      run: |
        for f in news status markets telemetry intelligence; do
          jq empty "data/$f.json" && echo "data/$f.json is valid JSON"
        done

    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated update of GDELT data"
        file_pattern: 'data/*.json'
