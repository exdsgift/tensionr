name: Update GDELT Data

on:
  schedule:
    - cron: '0 0 * * *'  # Ogni giorno a mezzanotte
  workflow_dispatch:      # Permette l'esecuzione manuale

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Fetch data from GDELT
      run: python src/fetch_gdelt.py

    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Automated update of GDELT data"
        file_pattern: 'data/latest.json'
