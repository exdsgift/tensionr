name: Tensionr Data Synchronizer

# The v1 pipeline. It no longer commits to `master`: current state goes to the `data`
# branch, which the Pages job overlays onto the site. That is what makes `master`
# protectable — it was taking roughly twelve automated commits a day, which left 93.6%
# of the repository's history as rewritten data (#6, #10).

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

# The timeout below lets a run outlast its own schedule, so runs can overlap, and two
# of them publishing to the same ref would race. One at a time — and a late run is not
# cancelled, because it has already paid for the fetch.
concurrency:
  group: data-synchronizer
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # to ask Pages for a rebuild

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: "3.12"

    - name: Install dependencies
      run: uv sync --frozen

    # Raised from 600s on #10, which found the old ceiling was being hit and the kill
    # landed mid-write. This bounds a hung fetch; it is not a budget for normal work.
    - name: Run data pipeline
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: timeout 2400 uv run tensionr

    - name: Validate output data
      run: |
        for f in news status markets telemetry intelligence; do
          jq empty "data/$f.json" && echo "data/$f.json is valid JSON"
        done

    # Named one by one rather than globbed: a git pathspec of data/*.json crosses `/`,
    # which is how the old file_pattern swept the archive along with current state.
    #
    # Today's archive snapshot goes here rather than to `history`, because it is not
    # finished: the v1 layout keeps one file per day and rewrites it all day, and the
    # site's historical view reads it straight off data/archive/. On this ref it is
    # rewritten in place with no accumulated history, which is the amplification #10
    # objected to. The step below moves each day to `history` once it is closed.
    - name: Publish current state
      id: publish
      run: |
        .github/scripts/publish.sh state data \
          data/news.json data/status.json data/markets.json \
          data/telemetry.json data/intelligence.json \
          "data/archive/$(date -u +%F).json" | tee publish.log
        grep -q 'nothing to push' publish.log \
          && echo "changed=false" >> "$GITHUB_OUTPUT" \
          || echo "changed=true"  >> "$GITHUB_OUTPUT"

    # A finished day is immutable, so it belongs on the append-only ref. Offered every
    # run and accepted once — IF_ABSENT makes the repeats no-ops rather than failures.
    - name: Close out yesterday's archive
      run: |
        yesterday="$(date -u -d yesterday +%F)"
        git fetch --quiet --no-tags --depth=1 origin data
        if git show FETCH_HEAD:"data/archive/$yesterday.json" > "/tmp/$yesterday.json" 2>/dev/null; then
          IF_ABSENT=1 .github/scripts/publish.sh history history history/v1 "/tmp/$yesterday.json"
        else
          echo "no snapshot for $yesterday on the data ref — nothing to close out"
        fi

    # The site is assembled from git refs, and this job no longer touches one that
    # Pages watches, so new data reaches the site only if the rebuild is asked for.
    - name: Rebuild the site
      if: steps.publish.outputs.changed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run pages.yml --ref master
