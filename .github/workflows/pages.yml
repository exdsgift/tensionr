name: Publish the site

# Publishes the site through GitHub Actions instead of letting Pages serve
# whatever happens to sit on `master` (#6, decision 1 and 3):
#
#   production            <- the `master` tip
#   staging/              <- the `staging` tip
#   preview/<branch>/     <- the tip of every branch with an open pull request
#
# actions/deploy-pages publishes ONE artifact as the entire site root, so every
# deployment replaces the whole site. The site is therefore reassembled from git
# refs on every run - see .github/scripts/assemble-site.sh for why that is the
# only safe shape, and note the consequence: a preview deployment also refreshes
# production from the current `master`, and never takes it down.
#
# Previews appear when a pull request opens and disappear when it closes, because
# the set of previews is derived from the open pull requests rather than stored
# anywhere.
#
# `staging` is a long-lived sandbox: pushed to directly, force-pushed freely, published
# at a real URL on the real data, and never able to take production down. A push to it
# deploys, and that is safe for the same reason a preview deployment is - the artifact
# is assembled from refs every time, so the production half of it always comes from
# `master` no matter which branch triggered the run. Staging is also `optional` in
# assemble-site.sh: a staging tree that will not build is reported and skipped, while a
# production tree that will not build aborts the deployment.
#
# The data pipeline is not involved. It lives in stories.yml on `schedule` +
# `workflow_dispatch` and must never run on a pull request (#6). It does, however,
# *ask* for a rebuild: the pipeline writes to the `data` branch rather than to
# `master` (#10), so nothing about a data update changes a ref this workflow watches.
# The publishing job dispatches this workflow when it lands new data, and without
# that the site would freeze at whatever the last merge produced.
#
# Since #81 the page is a Next.js static export rather than a generated HTML file, and
# `basePath` cannot be relative — so assembly builds the frontend once per tree it
# publishes, which is the slow part of a run. See assemble-site.sh.
#
# A pull request can never deploy: its ref is `refs/pull/<n>/merge`, which no
# environment branch policy can name. So a pull-request run assembles and uploads —
# which is still worth doing, because it catches a broken assembly before it reaches
# production — and then dispatches this same workflow on `master`, which can.

on:
  push:
    branches: [master, staging]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: "Assemble and upload the artifact but do not publish it. Use this to verify the build before switching the Pages build type."
        type: boolean
        default: false

# Pages allows one deployment at a time, and cancelling mid-flight can leave the site
# half-published, so runs queue instead of superseding one another.
#
# But only one run may *queue* per group: a newer queued run cancels the older one, and
# `cancel-in-progress: false` does not change that. A merged pull request's `closed`
# event creates a run that does nothing (its jobs are skipped below) — and that empty run
# was joining this group and cancelling the merge's own queued `push` rebuild. So a run
# that will do nothing gets a group of its own and competes with no one.
concurrency:
  group: >-
    ${{ (github.event.action == 'closed' && github.event.pull_request.merged)
        && format('pages-noop-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: false

permissions:
  contents: read


jobs:
  build:
    name: Site · assemble
    runs-on: ubuntu-latest
    # Two guards.
    #
    # A fork's pull request gets a read-only token and must never be able to publish to
    # this Pages site.
    #
    # And a *merged* pull request needs nothing from this workflow: the merge is a push
    # to master, which triggers a run of its own, and previews are derived from the open
    # pull requests, so the merged branch drops out of that run by itself. Without this,
    # one merge produced three runs — `pull_request: closed`, the `push`, and the
    # hand-off dispatch the closed run fired — and the push was then cancelled as a
    # superseded queue entry, which is pure waste. A pull request closed *without*
    # merging is different: nothing else fires, and its preview has to be taken down.
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      !(github.event.action == 'closed' && github.event.pull_request.merged)
    permissions:
      contents: read
      pull-requests: read
      pages: read
      actions: write   # to hand the deploy over to a run on master
    outputs:
      pages_build_type: ${{ steps.pages_state.outputs.build_type }}
      site_base_url: ${{ steps.pages_state.outputs.html_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # assemble-site.sh builds each tree's frontend, so this job needs a Node
      # toolchain even though it never runs npm itself. The cache is keyed on this
      # checkout's lockfile rather than each cloned tree's, which is the right trade:
      # branches nearly always share dependencies with master, so the cache hits, and
      # a branch that genuinely changes them just installs from the registry.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Read the current Pages configuration
        id: pages_state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `build_type` is `legacy` until the repository setting is switched to
          # "GitHub Actions". The deploy job below stays skipped while that is
          # the case, so this workflow can land and be verified without taking
          # the live legacy site down. See the checklist on #18.
          if pages_json="$(gh api "repos/${GITHUB_REPOSITORY}/pages" 2>/dev/null)"; then
            build_type="$(jq -r '.build_type // "unknown"' <<< "$pages_json")"
            html_url="$(jq -r '.html_url // ""' <<< "$pages_json")"
          else
            build_type="unavailable"
            html_url=""
          fi
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
          echo "html_url=$html_url" >> "$GITHUB_OUTPUT"
          echo "Pages build_type: $build_type"

      - name: Collect the branches that should have a preview
        id: previews
        env:
          GH_TOKEN: ${{ github.token }}
          # On a `closed` event the pull request may still be listed as open for
          # a moment; drop it explicitly so a merged branch's preview goes away
          # in the same run that removes it.
          CLOSING_BRANCH: >-
            ${{ github.event_name == 'pull_request' && github.event.action == 'closed'
                && github.event.pull_request.head.ref || '' }}
        run: |
          branches="$(
            gh pr list --state open --limit 100 \
              --json headRefName,isCrossRepository \
              --jq '.[] | select(.isCrossRepository == false) | .headRefName' \
            | sort -u
          )"
          if [[ -n "$CLOSING_BRANCH" ]]; then
            branches="$(grep -vxF "$CLOSING_BRANCH" <<< "$branches" || true)"
          fi
          {
            echo "branches<<__EOF__"
            printf '%s\n' "$branches"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Previews to publish:"
          printf '%s\n' "${branches:-  (none)}"

      - name: Assemble the site
        id: assemble
        env:
          PRODUCTION_BRANCH: master
          STAGING_BRANCH: staging
          # A branch with an open pull request already gets a preview; it does not also
          # need to be listed as staging, and `staging` itself normally has no pull
          # request open.
          PREVIEW_BRANCHES: ${{ steps.previews.outputs.branches }}
          SITE_BASE_URL: ${{ steps.pages_state.outputs.html_url }}
        run: .github/scripts/assemble-site.sh _site

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Summary
        env:
          BASE_URL: ${{ steps.pages_state.outputs.html_url }}
          BRANCHES: ${{ steps.previews.outputs.branches }}
          BUILD_TYPE: ${{ steps.pages_state.outputs.build_type }}
          STAGING: ${{ steps.assemble.outputs.staging_published }}
        run: |
          {
            echo "### Pages artifact assembled"
            echo
            echo "- Pages \`build_type\`: \`$BUILD_TYPE\`"
            echo "- production: ${BASE_URL:-<Pages base URL unknown>}"
            if [[ "$STAGING" == "1" ]]; then
              echo "- staging: ${BASE_URL%/}/staging/"
            else
              echo "- staging: not published (no \`staging\` branch)"
            fi
            if [[ -n "${BRANCHES// /}" ]]; then
              echo "- previews:"
              while IFS= read -r b; do
                [[ -n "$b" ]] || continue
                echo "  - \`$b\`: ${BASE_URL%/}/preview/$b/"
              done <<< "$BRANCHES"
            else
              echo "- previews: none (no open pull requests on this repository)"
            fi
            if [[ "$BUILD_TYPE" != "workflow" ]]; then
              echo
              echo "> The deploy job was skipped: Pages is still a \`$BUILD_TYPE\` build."
              echo "> Switch **Settings -> Pages -> Build and deployment -> Source** to"
              echo "> **GitHub Actions** and re-run this workflow. Until then the artifact"
              echo "> above is built but not published, and the existing live site is"
              echo "> untouched."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The assembly above proved the tree builds; publishing it needs a ref an
      # environment policy can name, and `refs/pull/<n>/merge` is not one. Hand it to
      # master's copy of this workflow, which assembles the same tree — previews are
      # derived from the open pull requests, not from the ref being built, so the
      # result is identical.
      - name: Hand the deploy to a run on master
        if: >-
          github.event_name == 'pull_request' &&
          steps.pages_state.outputs.build_type == 'workflow'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref master
          echo "dispatched pages.yml on master to publish this assembly" \
            >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Site · deploy to Pages
    needs: build
    # Two guards, both deliberate:
    #  - `workflow` build type: the very first run of this workflow happens while
    #    Pages is still a `legacy` build, when actions/deploy-pages cannot
    #    succeed. Skipping keeps the check green and makes the workflow start
    #    publishing by itself once the setting is switched.
    #  - `skip_deploy`: a manual dry run that assembles and uploads only.
    #  - pull requests deploy from `refs/pull/<n>/merge`, which no environment branch
    #    policy can name, so the attempt could only ever fail — and a permanently red
    #    check is worse than none once `master` has a branch rule. The build job
    #    dispatches a run on `master` instead.
    if: >-
      needs.build.outputs.pages_build_type == 'workflow' &&
      github.event.inputs.skip_deploy != 'true' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
